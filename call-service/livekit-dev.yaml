# Development LiveKit server config (LAN only). Run with:
#   livekit-server --config call-service/livekit-dev.yaml
port: 7880
rtc:
  # UDP media port range for WebRTC. LAN-only dev: no TLS/TURN required when
  # both devices share the same network (host candidates are reachable).
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
keys:
  # Must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in call-service/.env.
  devkey: VPqqifdoS1H9pKp8K54ubfrHOO5iViPsA0ZyMt3J1eFB
# TURN stays disabled for same-LAN development; enable it when a device is
# off-LAN (see README for the production note).
